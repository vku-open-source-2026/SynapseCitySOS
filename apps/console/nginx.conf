server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
    # React/Vite needs inline styles and the pre-paint boot script; Google Fonts
    # is the only external style/font origin. Session tokens live in
    # sessionStorage, so CSP is the complementary XSS control.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'" always;

    # Tier-3 workspace contract (2026-11-14): login, registration and every
    # emergency command/coordination dashboard live in the Tier-2 SynapseDX
    # workspace. These redirects run before the SPA so a deep link or bookmark
    # can never mount a local dashboard. No token, session or user value is
    # copied into the redirect URL.
    location = /login { return 308 https://synapsedx.sbs/workspace; }
    location = /register { return 308 https://synapsedx.sbs/workspace; }
    location = /workspace { return 308 https://synapsedx.sbs/workspace; }
    location ^~ /workspace/ { return 308 https://synapsedx.sbs/workspace; }
    location = /admin { return 308 https://synapsedx.sbs/workspace; }
    location ^~ /admin/ { return 308 https://synapsedx.sbs/workspace; }
    location = /technician { return 308 https://synapsedx.sbs/workspace; }
    location ^~ /technician/ { return 308 https://synapsedx.sbs/workspace; }

    location / {
        try_files $uri /index.html;
    }
}
