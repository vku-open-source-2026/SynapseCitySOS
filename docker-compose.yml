services:
  sos-service:
    image: ghcr.io/${SYNAPSECITYSOS_IMAGE_OWNER:-vku-open-source-2026}/synapsecitysos-sos-service:${SYNAPSECITYSOS_VERSION:-latest}
    build:
      context: ..
      dockerfile: SynapseCitySOS/apps/sos-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8084"
      SYNAPSEDX_BASE_URL: https://synapsedx.sbs
      ALLOW_LOCAL_DEPENDENCIES: "false"
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Identity is verified by the Tier-2 auth capability (Tier-1 IAM backed).
      # `demo` is refused when NODE_ENV=production.
      SOS_AUTH_MODE: ${SOS_AUTH_MODE:-tier2}
      SOS_BOOTSTRAP_ADMIN_EMAILS: ${SOS_BOOTSTRAP_ADMIN_EMAILS:-}
      SOS_AUTH_DEFAULT_ROLE: ${SOS_AUTH_DEFAULT_ROLE:-responder}
      SOS_AUTH_EXCHANGE: ${SOS_AUTH_EXCHANGE:-false}
      # Production refuses ALLOW_DEMO_AUTH=true at startup. Keep it false in a
      # production stack.
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-false}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-60}
      RATE_LIMIT_STREAM_MAX: ${RATE_LIMIT_STREAM_MAX:-30}
      RATE_LIMIT_GEO_MAX: ${RATE_LIMIT_GEO_MAX:-120}
      RATE_LIMIT_AI_MAX: ${RATE_LIMIT_AI_MAX:-30}
      VNDMS_STALE_MINUTES: ${VNDMS_STALE_MINUTES:-60}
      SYNAPSEDX_TIMEOUT_MS: ${SYNAPSEDX_TIMEOUT_MS:-20000}
      SYNAPSEDX_AI_TIMEOUT_MS: ${SYNAPSEDX_AI_TIMEOUT_MS:-45000}
      SOS_STREAM_EVENT_POLL_MS: ${SOS_STREAM_EVENT_POLL_MS:-2000}
    expose: ["8084"]
    networks: [synapsecity-sos]
  gateway:
    image: ghcr.io/${SYNAPSECITYSOS_IMAGE_OWNER:-vku-open-source-2026}/synapsecitysos-gateway:${SYNAPSECITYSOS_VERSION:-latest}
    build:
      context: ..
      dockerfile: SynapseCitySOS/apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUST_LOG: ${RUST_LOG:-info}
      # Gateway always listens on 8080 inside the stack; the TLS edge and the
      # console proxy target this container port.
      PORT: "8080"
      SOS_SERVICE_URL: http://sos-service:8084
      CONSOLE_URL: http://console:80
      CORS_ORIGIN: https://sos.synapsecity.sbs
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-10000}
      GATEWAY_CONSOLE_TIMEOUT_MS: ${GATEWAY_CONSOLE_TIMEOUT_MS:-15000}
    healthcheck:
      test: ["CMD", "/usr/local/bin/synapsecity-sos-gateway", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on: [sos-service, console]
    ports:
      # Host 8086 is the local/public-stack gateway entry; 8084 stays the
      # private sos-service port so the two can never be confused.
      # Loopback only: the public edge is synapseone-nginx (80/443).
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8086}:8080"
    networks:
      synapsecity-sos:
        aliases: [synapsecity-sos-gateway]
  console:
    image: ghcr.io/${SYNAPSECITYSOS_IMAGE_OWNER:-vku-open-source-2026}/synapsecitysos-console:${SYNAPSECITYSOS_VERSION:-latest}
    build:
      context: ./apps/console
      dockerfile: Dockerfile
      args:
        VITE_BASE_API_URL: /v1
    restart: unless-stopped
    expose: ["80"]
    networks:
      synapsecity-sos:
        aliases: [synapsecity-sos-console]

networks:
  synapsecity-sos:
    name: synapsecity-sos-public-stack
