# Include this in the public TLS edge that owns sos.synapsecity.sbs.
# The edge joins the synapsecity-sos-public-stack Docker network and reaches
# the gateway/console by their stable network aliases. Gateway container port
# is always 8080; the host port (default 8086) is only for local access.

# Log format deliberately omits $request (which includes the query string) so a
# token can never be written to an access log even if a client appends one.
log_format sos_safe '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=sos_auth:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=sos_stream:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sos_geo:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=sos_ai:10m rate=30r/m;

server {
  listen 443 ssl http2;
  server_name sos.synapsecity.sbs;
  # Supply certificates in the host edge configuration.

  access_log /var/log/nginx/sos.access.log sos_safe;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location = /health {
    proxy_pass http://synapsecity-sos-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /ready {
    proxy_pass http://synapsecity-sos-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Auth shell: tight per-IP burst; the service also enforces a per-process
  # limiter. Credentials are verified by the Tier-2 auth capability
  # (SOS_AUTH_MODE=tier2); the demo shell needs SOS_AUTH_MODE=demo plus
  # ALLOW_DEMO_AUTH=true outside production.
  location ^~ /v1/auth/ {
    limit_req zone=sos_auth burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://synapsecity-sos-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Server-sent hazard stream: disable buffering so events reach the browser
  # as soon as the SOS gateway writes them. A dependency failure produces a
  # named `error` event, never an empty snapshot.
  location ^~ /v1/emergency/stream/ {
    limit_req zone=sos_stream burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://synapsecity-sos-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location ^~ /v1/geo/ {
    limit_req zone=sos_geo burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://synapsecity-sos-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /v1/ai/ {
    limit_req zone=sos_ai burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://synapsecity-sos-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The gateway enforces the SOS API namespace boundary before proxying to
  # sos-service.
  location = /v1 {
    proxy_pass http://synapsecity-sos-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /v1/ {
    proxy_pass http://synapsecity-sos-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # The product root and client-side routes belong to the console.
  location / {
    proxy_pass http://synapsecity-sos-console:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
