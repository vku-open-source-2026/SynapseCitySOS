name: Mobile build

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify

  build:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Install JS dependencies
        run: npm ci
      - name: Build unsigned release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            -Pexpo.signing.skip=true
      - name: Prepare artifact
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          mkdir -p dist
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          cp "$APK" "dist/SynapseSOS-${VERSION}-unsigned.apk"
          sha256sum "dist/SynapseSOS-${VERSION}-unsigned.apk" > "dist/SHA256SUMS.txt"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          cat "dist/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: synapsecity-sos-android-${{ env.VERSION }}-unsigned
          path: |
            mobile/dist/SynapseSOS-${{ env.VERSION }}-unsigned.apk
            mobile/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  github-release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect public release metadata
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./mobile/app.json').expo.version")"
          LINK="$(grep -o 'https://synapsedx.sbs/v1/capabilities/public/files/synapsecity-sos-android-[^ )]*' README.md | head -1)"
          SHA="$(grep -o '[a-f0-9]\{64\}' docs/MOBILE_AUDIT.md | head -1)"
          test -n "$LINK"
          test -n "$SHA"
          {
            echo "SIGNED_APK_LINK=$LINK"
            echo "SIGNED_APK_SHA=$SHA"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            SynapseSOS Android ${{ env.VERSION }}

            Signed APK (Tier-2 public file backed by Tier-1 SynapseOCS):
            ${{ env.SIGNED_APK_LINK }}

            SHA-256: `${{ env.SIGNED_APK_SHA }}`

            The GitHub artifact is **unsigned**; the protected production
            release job signs it with the upload keystore and publishes it to
            SynapseOCS. Package: `sbs.synapsecity.sos`.

