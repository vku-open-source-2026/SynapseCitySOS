name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify registry Tier-2 SDK
        run: node -e "const d=require('./apps/sos-service/package.json').dependencies['@synapsedx/capabilities']; if(!/^[~^]?\d+\.\d+\.\d+/.test(d)) { console.error('expected registry semver, got '+d); process.exit(1); } console.log('@synapsedx/capabilities '+d);"

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Prepare compose env
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push images
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          images="synapsecitysos-sos-service synapsecitysos-gateway synapsecitysos-console"
          for image in $images; do
            remote="ghcr.io/${OWNER}/${image}"
            docker tag "${image}:latest" "${remote}:${TAG}"
            docker tag "${image}:latest" "${remote}:latest"
            docker tag "${image}:latest" "${remote}:sha-${SHA}"
            docker push "${remote}:${TAG}"
            docker push "${remote}:latest"
            docker push "${remote}:sha-${SHA}"
          done

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            infra/nginx/synapsecity-sos.conf
          body: |
            SynapseCitySOS ${{ github.ref_name }}

            Images:
            - `ghcr.io/${{ github.repository_owner }}/synapsecitysos-sos-service:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsecitysos-gateway:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsecitysos-console:${{ github.ref_name }}`

            The pinned Tier-2 SDK tarball and checksum are attached.
